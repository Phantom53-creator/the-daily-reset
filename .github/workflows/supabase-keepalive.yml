# Keeps the free-plan Supabase project from auto-pausing (it pauses after ~7 idle days;
# while paused, sign-ups, reviews and premium login silently fail).
# Runs daily on GitHub's servers — nothing to do with the cPanel host.
# Reads the project URL + publishable key from access.js (public by design) so there is
# one source of truth. A non-200 reply fails the run, and GitHub emails the repo owner.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          set -euo pipefail
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" access.js | head -1)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" access.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Could not find the Supabase URL/key in access.js"; exit 1
          fi
          CODE=$(curl -sS -m 30 -o /tmp/body -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/leads?select=id&limit=1")
          echo "Supabase REST status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase did not answer 200 (got $CODE) — project may be paused or the key changed"
            head -c 300 /tmp/body; echo; exit 1
          fi
