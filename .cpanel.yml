---
# cPanel "Git Version Control" deploy config — this is cPanel's own supported
# mechanism for "push to deploy" (the closest equivalent to what Vercel does
# automatically on every `git push`). It does nothing unless someone actively
# sets up this repo as a cPanel Git Version Control repository and clicks
# "Deploy HEAD Commit" (or triggers it via their deploy hook) — completely
# inert everywhere else, including on Vercel.
#
# ACTION NEEDED before this works: replace <CPANEL_USERNAME> and
# <DOCROOT_PATH> below with the real values from the cPanel account (ask the
# web guy — this is exactly the info requested in the migration runbook).
# DOCROOT_PATH is normally something like public_html (if dailyresetlabs.com
# is the account's primary domain) or public_html/dailyresetlabs.com (if it's
# an addon domain) — do NOT guess; confirm it first, a wrong path here would
# copy the site into the wrong folder.
deployment:
  tasks:
    - export DEPLOYPATH=/home/<CPANEL_USERNAME>/<DOCROOT_PATH>/
    - /bin/cp -R * $DEPLOYPATH
    - /bin/cp -R .htaccess $DEPLOYPATH 2>/dev/null || true
